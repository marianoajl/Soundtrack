    const header=el('div',{class:'view-header'});
    header.innerHTML=`<h2>👥 Gestión de Usuarios</h2>`;
    const addBtn=el('button',{class:'btn btn-primary',style:{fontSize:'.8rem',whiteSpace:'nowrap'}},['+ Nuevo usuario']);
    addBtn.onclick=()=>App.navigate('admin-register');
    header.append(addBtn);
    this.append(header);

    const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(270px,1fr))',gap:'.85rem',padding:'1.1rem 1.5rem'}});
    App.data.users.forEach(u=>{
      const c=App.roleColor(u.role);
      const card=el('div',{style:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'1rem',position:'relative',overflow:'hidden'}});
      const bar=el('div',{style:{position:'absolute',top:0,left:0,width:'3px',height:'100%',background:c}});
      const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}});
      const info=el('div',{style:{paddingLeft:'7px',minWidth:0,flex:'1'}});
      info.append(
        el('div',{style:{fontWeight:'600',fontSize:'.92rem',marginBottom:'.25rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[u.name]),
        el('div',{style:{fontSize:'.78rem',color:'var(--text2)',marginBottom:'.4rem'}},[`@${u.username}`])
      );
      info.append(badge(App.roleLabel(u.role),c));
      const acts=el('div',{style:{display:'flex',gap:'.3rem',flexShrink:0,marginLeft:'.5rem'}});
      // Don't allow editing yourself to prevent accidental lockout
      if(u.id!==App.user.id){
        const eb=el('button',{class:'btn',style:{padding:'.25rem .5rem',fontSize:'.78rem'}},['✏️']);
        eb.onclick=()=>this.openForm(u);
        const db=el('button',{class:'btn btn-danger',style:{padding:'.25rem .5rem',fontSize:'.78rem'}},['🗑️']);
        db.onclick=()=>{if(confirm(`¿Eliminar usuario "${u.name}"?`)){App.data.users=App.data.users.filter(x=>x.id!==u.id);this.render()}};
        acts.append(eb,db);
      } else {
        acts.append(el('span',{style:{fontSize:'.72rem',color:'var(--text3)',padding:'.3rem .4rem'}},['(vos)']));
      }
      top.append(info,acts);
      card.append(bar,top);
      grid.append(card);
    });
    this.append(grid);
  }
  openForm(u){const m=document.createElement('user-form-modal');m.userData=u;m.onSave=()=>this.render();document.body.append(m)}
}
customElements.define('users-view',UsersView);

class UserFormModal extends HTMLElement {
  connectedCallback(){
    this.className='modal-overlay';
    const u=this.userData, isEdit=!!u;
    const box=el('div',{class:'modal-box',style:{maxWidth:'420px',maxHeight:'90svh',overflowY:'auto'}});
    
    box.innerHTML=`<h3 style="font-size:1rem;font-weight:600;margin-bottom:1rem">${isEdit?'Editar':'Nuevo'} Usuario</h3>`;

    // Error panel
    const errBox=el('div',{style:{display:'none',background:'rgba(240,74,74,.1)',border:'1px solid rgba(240,74,74,.4)',borderRadius:'var(--radius)',padding:'.65rem .75rem',marginBottom:'.75rem',fontSize:'.8rem',color:'var(--red)',lineHeight:'1.4'}});
    box.append(errBox);
    const showErr=(msg)=>{errBox.textContent=msg;errBox.style.display='block'};
    const clearErr=()=>{errBox.style.display='none'};

    // Name
    const fnWrap=el('div',{style:{marginBottom:'.65rem'}});
    fnWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Nombre']));
    const fnIn=el('input',{id:'uf-fname',type:'text',placeholder:'Nombre',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'},value:u?.firstName||''});
    fnWrap.append(fnIn);
    box.append(fnWrap);

    // Lastname
    const lnWrap=el('div',{style:{marginBottom:'.65rem'}});
    lnWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Apellido']));
    const lnIn=el('input',{id:'uf-lname',type:'text',placeholder:'Apellido',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'},value:u?.lastName||''});
    lnWrap.append(lnIn);
    box.append(lnWrap);

    // Phone
    const phoneWrap=el('div',{style:{marginBottom:'.65rem'}});
    phoneWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Teléfono']));
    const phoneRow=el('div',{style:{display:'flex',gap:'.3rem',width:'100%'}});
    const codeSel=el('select',{id:'uf-code',style:{width:'95px',flexShrink:'0',padding:'.6rem .4rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.8rem'}});
    COUNTRY_CODES.forEach(c=>{
      const opt=el('option',{value:c.code},[`${c.flag} ${c.code}`]);
      if(u&&u.phone){
        const phoneCode=u.phone.split(' ')[0];
        if(c.code===phoneCode) opt.selected=true;
      } else if(c.code==='+54') opt.selected=true;
      codeSel.append(opt);
    });
    const phoneIn=el('input',{id:'uf-phone',type:'tel',placeholder:'Número',style:{flex:'1',minWidth:'0',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'},value:u?.phone?u.phone.split(' ')[1]:''});
    phoneRow.append(codeSel,phoneIn);
    phoneWrap.append(phoneRow);
    box.append(phoneWrap);

    // Email
    const emailWrap=el('div',{style:{marginBottom:'.65rem'}});
    emailWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Correo electrónico']));
    const emailIn=el('input',{id:'uf-email',type:'email',placeholder:'ejemplo@correo.com',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'},value:u?.email||''});
    emailWrap.append(emailIn);
    box.append(emailWrap);

    // Email confirm (only for new users)
    if(!isEdit){
      const email2Wrap=el('div',{style:{marginBottom:'.65rem'}});
      email2Wrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Confirmar correo']));
      const email2In=el('input',{id:'uf-email2',type:'email',placeholder:'Confirmá tu correo',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
      email2Wrap.append(email2In);
      box.append(email2Wrap);
    }

    // Password validation helpers
    const validatePass=(pass)=>({
      length:pass.length>=8,
      lower:/[a-z]/.test(pass),
      upper:/[A-Z]/.test(pass),
      digit:/\d/.test(pass),
      special:/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)
    });

    // Password field
    const passWrap=el('div',{style:{marginBottom:'.65rem'}});
    passWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},[isEdit?'Nueva contraseña (dejá vacío para no cambiar)':'Contraseña']));
    const passPw=el('div',{style:{position:'relative',marginBottom:'.35rem'}});
    const passIn=el('input',{id:'uf-pass',type:'password',placeholder:isEdit?'Sin cambios':'••••••••',style:{width:'100%',padding:'.6rem 2.5rem .6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
    const passEye=el('button',{style:{position:'absolute',right:'0.5rem',top:'50%',transform:'translateY(-50%)',width:'2rem',height:'2rem',background:'transparent',border:'none',color:'var(--text3)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:'0'}});
    const svgEye=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    passEye.innerHTML=svgEye; let passVis=false;
    passEye.onclick=(e)=>{e.preventDefault();passVis=!passVis;passIn.type=passVis?'text':'password';passEye.innerHTML=passVis?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>`:svgEye;passEye.style.color=passVis?'var(--accent)':'var(--text3)'};
    passPw.append(passIn,passEye);

    // Strength requirements (only for new users)
    if(!isEdit){
      const reqList=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.3rem',fontSize:'.72rem',color:'var(--text3)',marginBottom:'.4rem'}});
      const mkReq=(text,id)=>{
        const req=el('div',{id,style:{display:'flex',alignItems:'center',gap:'.3rem',padding:'.25rem'}});
        req.append(el('span',{style:{fontSize:'.8rem'}},['○']),el('span',{},[text]));
        return req;
      };
      const req8=mkReq('8+ caracteres','rq-len');
      const reqLow=mkReq('Minúscula','rq-low');
      const reqUp=mkReq('Mayúscula','rq-up');
      const reqDig=mkReq('Número','rq-dig');
      const reqSpe=mkReq('Carácter especial','rq-spe');
      reqList.append(req8,reqLow,reqUp,reqDig,reqSpe);
      passWrap.append(passPw,reqList);
      
      const updateReqs=()=>{
        const v=validatePass(passIn.value);
        document.getElementById('rq-len').style.color=v.length?'var(--green)':'var(--text3)';
        document.getElementById('rq-len').querySelector('span').textContent=v.length?'✓':'○';
        document.getElementById('rq-low').style.color=v.lower?'var(--green)':'var(--text3)';
        document.getElementById('rq-low').querySelector('span').textContent=v.lower?'✓':'○';
        document.getElementById('rq-up').style.color=v.upper?'var(--green)':'var(--text3)';
        document.getElementById('rq-up').querySelector('span').textContent=v.upper?'✓':'○';
        document.getElementById('rq-dig').style.color=v.digit?'var(--green)':'var(--text3)';
        document.getElementById('rq-dig').querySelector('span').textContent=v.digit?'✓':'○';
        document.getElementById('rq-spe').style.color=v.special?'var(--green)':'var(--text3)';
        document.getElementById('rq-spe').querySelector('span').textContent=v.special?'✓':'○';
      };
      passIn.addEventListener('input',updateReqs);
    } else {
      passWrap.append(passPw);
    }
    box.append(passWrap);

    // Confirm password (only for new users)
    if(!isEdit){
      const pass2Wrap=el('div',{style:{marginBottom:'.65rem'}});
      pass2Wrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Confirmar contraseña']));
      const pass2Pw=el('div',{style:{position:'relative'}});
      const pass2In=el('input',{id:'uf-pass2',type:'password',placeholder:'••••••••',style:{width:'100%',padding:'.6rem 2.5rem .6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
      const pass2Eye=el('button',{style:{position:'absolute',right:'0.5rem',top:'50%',transform:'translateY(-50%)',width:'2rem',height:'2rem',background:'transparent',border:'none',color:'var(--text3)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:'0'}});
      pass2Eye.innerHTML=svgEye; let pass2Vis=false;
      pass2Eye.onclick=(e)=>{e.preventDefault();pass2Vis=!pass2Vis;pass2In.type=pass2Vis?'text':'password';pass2Eye.innerHTML=pass2Vis?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>`:svgEye;pass2Eye.style.color=pass2Vis?'var(--accent)':'var(--text3)'};
      pass2Pw.append(pass2In,pass2Eye);
      pass2Wrap.append(pass2Pw);
      box.append(pass2Wrap);
    }

    // Role
    const roles=[
      {v:'admin',   l:'Administrador'},
      {v:'deposito',l:'Depósito'},
      {v:'viewer',  l:'Viewer'},
      {v:'driver',  l:'Transportista'}
    ];
    box.append(ffSelect('Perfil','uf-role',roles,u?.role||'viewer'));

    // Footer
    const footer=el('div',{class:'modal-footer'});
    const cancel=el('button',{class:'btn'},['Cancelar']);
    cancel.onclick=()=>this.remove();
    
    const save=el('button',{class:'btn btn-primary'},[isEdit?'Guardar cambios':'Crear usuario']);
    save.onclick=()=>{
      clearErr();
      const firstName=box.querySelector('#uf-fname').value.trim();
      const lastName=box.querySelector('#uf-lname').value.trim();
      const countryCode=box.querySelector('#uf-code').value;
      const phone=box.querySelector('#uf-phone').value.trim();
      const email=box.querySelector('#uf-email').value.trim();
      const pass=box.querySelector('#uf-pass').value;
      const role=box.querySelector('#uf-role').value;

      if(!firstName||!lastName){showErr('Nombre y apellido son obligatorios.');return}
      if(!phone){showErr('Ingresá un número de teléfono.');return}
      if(!/^\d{4,15}$/.test(phone.replace(/\s|-/g,''))){showErr('Número de teléfono inválido.');return}
      if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('Correo electrónico inválido.');return}

      if(!isEdit){
        // New user validations
        const email2=box.querySelector('#uf-email2').value.trim();
        if(email!==email2){showErr('Los correos electrónicos no coinciden.');return}
        if(App.data.users.find(x=>x.username===email)){showErr('Ese correo ya está registrado.');return}
        if(!pass){showErr('Ingresá una contraseña.');return}
        const passVal=validatePass(pass);
        if(!passVal.length){showErr('La contraseña debe tener al menos 8 caracteres.');return}
        if(!passVal.lower){showErr('La contraseña debe incluir una letra minúscula.');return}
        if(!passVal.upper){showErr('La contraseña debe incluir una letra mayúscula.');return}
        if(!passVal.digit){showErr('La contraseña debe incluir un número.');return}
        if(!passVal.special){showErr('La contraseña debe incluir un carácter especial (!@#$%^&*).');return}
        const pass2=box.querySelector('#uf-pass2').value;
        if(pass!==pass2){showErr('Las contraseñas no coinciden.');return}

        // Create user
        const name=`${firstName} ${lastName}`;
        App.data.users.push({
          id:++App.nextId.user,
          name,
          firstName,
          lastName,
          username:email,
          email,
          phone:`${countryCode} ${phone}`,
          password:pass,
          role
        });
      } else {
        // Edit user
        if(App.data.users.find(x=>x.username===email&&x.id!==u.id)){showErr('Ese correo ya está en uso.');return}
        u.firstName=firstName;
        u.lastName=lastName;
        u.name=`${firstName} ${lastName}`;
        u.email=email;
        u.username=email;
        u.phone=`${countryCode} ${phone}`;
        u.role=role;
        if(pass) u.password=pass;
      }
      if(this.onSave)this.onSave();
      this.remove();
    };
    footer.append(cancel,save);
    box.append(footer);
    this.onclick=e=>{if(e.target===this)this.remove()};
    this.append(box);
  }
}
customElements.define('user-form-modal',UserFormModal);

// ─── MY TRIPS VIEW (driver only) ─────────────────────────────────────────────
class MyTripsView extends HTMLElement {
  connectedCallback(){this.render()}
  render(){
    this.innerHTML='';
    const header=el('div',{class:'view-header'});
    header.innerHTML=`<h2>🚚 Mis Viajes</h2>`;
    // Week range info
    const now=new Date();
    const weekEnd=new Date(now);weekEnd.setDate(weekEnd.getDate()+7);
    const rangeLabel=el('div',{style:{fontSize:'.75rem',color:'var(--text3)',whiteSpace:'nowrap'}},
      [`${now.toLocaleDateString('es-AR')} — ${weekEnd.toLocaleDateString('es-AR')}`]);
    header.append(rangeLabel);
    this.append(header);

    const nowStr=now.toISOString().slice(0,16);
    const weekEndStr=weekEnd.toISOString().slice(0,16);
    const driverName=App.user.name;

    // Filter dispatches: assigned to this driver AND overlap with next 7 days
    const myDispatches=App.data.dispatches.filter(d=>
      d.driver===driverName &&
      d.dateStart<=weekEndStr && d.dateEnd>=nowStr
    ).sort((a,b)=>a.dateStart.localeCompare(b.dateStart));

    const list=el('div',{class:'dispatch-list'});

    if(!myDispatches.length){
      list.append(el('div',{style:{padding:'3rem',textAlign:'center',color:'var(--text3)',fontSize:'.9rem'}},
        ['Sin viajes asignados en los próximos 7 días ✅']));
      this.append(list);return;
    }

    myDispatches.forEach(d=>{
      const orig=App.data.locations.find(l=>l.id===d.origin);
      const isActive=d.dateStart<=nowStr&&d.dateEnd>=nowStr;
      const isPast=d.dateEnd<nowStr;

      const card=el('div',{class:'dispatch-card',style:{borderLeft:`3px solid ${isActive?'var(--green)':isPast?'var(--border)':'var(--accent)'}`}});

      // Status + dates
      const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.55rem',gap:'.5rem'}});
      const dateInfo=el('div',{style:{minWidth:0,flex:'1'}});
      dateInfo.innerHTML=`<div style="font-weight:600;font-size:.9rem;margin-bottom:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${routeLabel(d)}</div><div style="font-size:.76rem;color:var(--text2)">${fmt(d.dateStart)} — ${fmt(d.dateEnd)}</div>`;
      const sb=badge(isActive?'En curso':isPast?'Finalizado':'Próximo',isActive?'#22c87a':isPast?'#888':'#7c6af7');
      sb.style.flexShrink='0';
      top.append(dateInfo,sb);

      // Stops timeline
      const stopsWrap=el('div',{style:{marginBottom:'.5rem'}});
      const allStops=[{locationId:d.origin,isOrigin:true},...(d.stops||[])];
      allStops.forEach((s,i)=>{
        const loc=App.data.locations.find(l=>l.id===s.locationId);
        const stopRow=el('div',{style:{display:'flex',gap:'.55rem',alignItems:'flex-start',marginBottom:'.15rem'}});
        const dotWrap=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',width:'16px',flexShrink:'0'}});
        const dot=el('div',{style:{width:'10px',height:'10px',borderRadius:'50%',background:loc?.color||'#888',border:`2px solid ${loc?.color||'#888'}88`,marginTop:'3px',flexShrink:'0'}});
        dotWrap.append(dot);
        if(i<allStops.length-1){const ln=el('div',{style:{width:'2px',flex:'1',background:'var(--border2)',margin:'.15rem auto',minHeight:'14px'}});dotWrap.append(ln)}
        const info=el('div',{style:{flex:'1',paddingBottom:'.25rem'}});
        const lnm=el('div',{style:{fontSize:'.83rem',fontWeight:'500'}},[(s.isOrigin?'🚦 ':'📍 ')+(loc?.name||'?')]);
        info.append(lnm);
        if(!s.isOrigin&&s.items?.length){
          const eq=el('div',{style:{fontSize:'.74rem',color:'var(--text2)',marginTop:'.1rem'}});
          eq.textContent=s.items.map(it=>{const e=App.data.equipment.find(x=>x.id===it.equipId);return`${it.qty}× ${e?.name||'?'}`}).join(' · ');
          info.append(eq);
        }
        stopRow.append(dotWrap,info);
        stopsWrap.append(stopRow);
      });

      // Notes
      const meta=el('div',{style:{fontSize:'.75rem',color:'var(--text3)',borderTop:'1px solid var(--border)',paddingTop:'.45rem',marginTop:'.1rem'}});
      meta.textContent=d.notes?`📝 ${d.notes}`:'';

      card.append(top,stopsWrap);
      if(d.notes) card.append(meta);
      list.append(card);
    });

    // Summary pills at top
    const active=myDispatches.filter(d=>d.dateStart<=nowStr&&d.dateEnd>=nowStr).length;
    const upcoming=myDispatches.filter(d=>d.dateStart>nowStr).length;
    const summary=el('div',{style:{display:'flex',gap:'.6rem',padding:'.75rem 1.5rem 0',flexWrap:'wrap'}});
    if(active) summary.append(badge(`${active} en curso`,'#22c87a'));
    if(upcoming) summary.append(badge(`${upcoming} próximo(s)`,'#7c6af7'));
    summary.append(el('span',{style:{fontSize:'.75rem',color:'var(--text3)',alignSelf:'center'}},[`${myDispatches.length} viaje(s) esta semana`]));
    this.append(summary,list);
  }
}
customElements.define('mytrips-view',MyTripsView);
