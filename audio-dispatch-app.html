<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SoundTrack — Gestión de Equipos de Audio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#0f0f11; --bg2:#18181c; --bg3:#222228;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0f0f0; --text2:#a0a0b0; --text3:#6a6a7a;
  --accent:#7c6af7; --green:#22c87a; --red:#f04a4a; --amber:#f0a020;
  --radius:10px; --radius-lg:14px; --shadow:0 4px 24px rgba(0,0,0,.5);
  --sidebar-w:220px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* Leaflet */
.leaflet-container{background:#1a1a22!important}
.leaflet-tile-pane{filter:brightness(.85) saturate(.7)}
.st-popup .leaflet-popup-content-wrapper{background:#18181c;border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#f0f0f0;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.st-popup .leaflet-popup-tip{background:#18181c}
.st-popup .leaflet-popup-content{margin:12px 14px;font-family:system-ui,sans-serif}
.leaflet-control-zoom a{background:#18181c!important;color:#f0f0f0!important;border-color:rgba(255,255,255,.12)!important}
.leaflet-control-zoom a:hover{background:#222228!important}
.leaflet-control-attribution{background:rgba(15,15,18,.7)!important;color:#6a6a7a!important}
.leaflet-control-attribution a{color:#a0a0b0!important}

/* Layout */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.bottom-nav{display:none}

/* Header */
.view-header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-shrink:0;position:sticky;top:0;z-index:10}
.view-header h2{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Map */
.map-outer{display:flex;flex-direction:column;height:calc(100vh - 57px)}
.map-body{display:flex;flex:1;overflow:hidden;min-height:0}
.map-container{flex:1;height:100%}
.map-panel{width:290px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:.85rem;flex-shrink:0}
.map-panel-toggle{display:none}

/* Table */
.table-wrap{overflow-x:auto;padding:0 1.25rem 1.5rem}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{text-align:left;padding:.7rem .5rem;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.65rem .5rem;border-bottom:1px solid var(--border);vertical-align:middle}
.mobile-cards{display:none;padding:.75rem}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.65rem;padding:1rem 1.25rem}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1100;padding:1rem}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.4rem;width:480px;max-width:100%;max-height:88vh;overflow-y:auto}
.modal-box.wide{width:560px}
.modal-box.sm{width:420px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-bottom:.85rem}
.form-field{margin-bottom:.85rem}
.form-field label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.3rem}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem}
.form-field textarea{resize:vertical}
.modal-footer{display:flex;gap:.65rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
.btn{padding:.45rem 1rem;border-radius:8px;font-size:.85rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{border-color:var(--red);color:var(--red)}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:500}

/* Autocomplete */
.ac-dropdown{position:absolute;top:calc(100% - .85rem);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.55);max-height:200px;overflow-y:auto;z-index:9999}
.ac-row{padding:.6rem .85rem;cursor:pointer;font-size:.83rem;border-bottom:1px solid var(--border);color:var(--text);line-height:1.35}
.ac-row:last-child{border-bottom:none}
.ac-row:hover{background:var(--bg3)}
/* Allow modal to overflow for dropdown */
.modal-box.sm.with-ac{overflow:visible;max-height:none}

/* Dispatch & location cards */
.dispatch-list{padding:1.1rem 1.5rem;display:flex;flex-direction:column;gap:.75rem}
.dispatch-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem}
.dispatch-actions{display:flex;gap:.45rem;margin-top:.65rem;flex-wrap:wrap}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.85rem;padding:1.1rem 1.5rem}
.loc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;position:relative;overflow:hidden}

/* Nav items */
.nav-item{padding:.6rem .9rem;display:flex;align-items:center;gap:.55rem;cursor:pointer;border-radius:8px;margin:0 .4rem;font-size:.87rem;color:var(--text2);transition:background .15s,color .15s;user-select:none}
.nav-item.active{color:var(--text);background:var(--bg3);font-weight:500}
.nav-item:hover:not(.active){color:var(--text);background:rgba(255,255,255,.04)}
.nav-label{overflow:hidden;white-space:nowrap}

/* ── TABLET (≤880px) ─────────────────────── */
@media(max-width:880px){
  :root{--sidebar-w:58px}
  .sidebar-logo-full,.nav-label,.sidebar-user-name,.sidebar-role,.sidebar-logout-full{display:none!important}
  .sidebar-logo-icon{display:block!important}
  .nav-item{justify-content:center;padding:.6rem;margin:0 .2rem}
  .sidebar-user{padding:.5rem;justify-content:center}
  .sidebar-logout-icon{display:block!important}
  .map-panel{width:250px}
}

/* ── MOBILE (≤640px) ─────────────────────── */
@media(max-width:640px){
  html,body{overflow:hidden;height:100%}
  .app-layout{flex-direction:column;height:100dvh;overflow:hidden}
  .sidebar{display:none}
  .content-area{overflow:hidden;flex:1;display:flex;flex-direction:column;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}

  /* Bottom nav */
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);
    z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.62rem;color:var(--text3);border:none;background:transparent;cursor:pointer;padding:.35rem 0;-webkit-tap-highlight-color:transparent}
  .bnav-btn.active{color:var(--accent)}
  .bnav-icon{font-size:1.3rem;line-height:1}

  /* Map - mobile */
  map-view{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .map-outer{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .map-body{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .map-container{
    flex:1 1 0;
    min-height:0;
    max-height:none;
    transition:none;
  }
  .map-panel{
    width:100%;
    border-left:none;
    border-top:1px solid var(--border);
    flex:0 0 auto;
    max-height:42%;
    overflow-y:auto;
    transition:max-height .2s ease, opacity .18s ease;
  }
  .map-panel.hidden{
    max-height:0 !important;
    overflow:hidden;
    opacity:0;
    border-top:none;
  }
  .map-panel-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:.6rem .85rem;font-size:.83rem;font-weight:500;
    background:var(--bg3);border-bottom:1px solid var(--border);
    cursor:pointer;user-select:none;flex-shrink:0;
  }
  .map-expanded-spacer{display:none}

  /* Equipment */
  .table-wrap{display:none}
  .mobile-cards{display:block}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:.5rem;padding:.75rem}

  /* View header */
  .view-header{padding:.75rem .9rem}
  .view-header h2{font-size:.9rem}

  /* Modals – bottom sheet */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal-box,.modal-box.wide,.modal-box.sm{
    width:100%;max-width:100%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    max-height:82dvh;padding:1rem .9rem calc(1.4rem + var(--nav-h) + env(safe-area-inset-bottom,0px));
  }
  .modal-box.with-ac{overflow:visible;max-height:none}
  .form-grid-2{grid-template-columns:1fr}
  .modal-footer{flex-direction:column-reverse}
  .modal-footer .btn{width:100%;text-align:center;padding:.7rem}
  /* Register name row stacks on mobile */
  register-screen .rg-name-row{grid-template-columns:1fr!important}

  /* Lists */
  .dispatch-list{padding:.75rem}
  .loc-grid{grid-template-columns:1fr;padding:.75rem}
  /* Non-map views need scroll inside fixed container */
  equipment-view, dispatches-view, locations-view, users-view, mytrips-view{
    display:block;
    height:calc(100dvh - 57px - var(--nav-h) - env(safe-area-inset-bottom,0px));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
}
</style>
</head>
<body>
<script>
// ─── STATE ──────────────────────────────────────────────────────────────────
const App = {
  user:null, view:'login', userLocation:null,
  data:{
    users:[
      {id:1,name:'Carlos Medina', username:'admin',    password:'admin123',    role:'admin'},
      {id:2,name:'Laura Ríos',    username:'deposito', password:'dep123',      role:'deposito'},
      {id:3,name:'Pablo Vera',    username:'viewer',   password:'viewer123',   role:'viewer'},
      {id:4,name:'Mario González',username:'mario',    password:'mario123',    role:'driver'}
    ],
    locations:[
      {id:1,name:'Depósito Central',type:'deposito',address:'Av. Corrientes 1234, CABA',      lat:-34.6041,  lng:-58.3934,  color:'#7c6af7'},
      {id:2,name:'Teatro Gran Rex', type:'show',     address:'Av. Corrientes 857, CABA',       lat:-34.60322, lng:-58.37895, color:'#22c87a'},
      {id:3,name:'Estadio Vélez',   type:'show',     address:'Av. Juan B. Justo 9200, Liniers',lat:-34.63535, lng:-58.52069, color:'#22c87a'},
      {id:4,name:'Luna Park',       type:'show',     address:'Av. Eduardo Madero 470, CABA',   lat:-34.60232, lng:-58.36870, color:'#22c87a'}
    ],
    categories:['Parlantes','Amplificadores','Micrófonos','Pies de micrófono','Equipos inalámbricos','Antenas de RF'],
    equipment:[
      {id:1, name:'JBL VTX A12',          category:'Parlantes',            quantity:12,model:'VTX A12'},
      {id:2, name:'QSC KLA12',             category:'Parlantes',            quantity:8, model:'KLA12'},
      {id:3, name:'Crown IT4x3500HD',      category:'Amplificadores',       quantity:6, model:'IT4x3500HD'},
      {id:4, name:'Lab Gruppen FP 10000Q', category:'Amplificadores',       quantity:4, model:'FP 10000Q'},
      {id:5, name:'Shure SM58',            category:'Micrófonos',           quantity:20,model:'SM58'},
      {id:6, name:'Sennheiser e945',       category:'Micrófonos',           quantity:10,model:'e945'},
      {id:7, name:'K&M 210/2',             category:'Pies de micrófono',    quantity:30,model:'210/2'},
      {id:8, name:'Shure ULXD4Q',          category:'Equipos inalámbricos', quantity:4, model:'ULXD4Q'},
      {id:9, name:'Sennheiser EW-D',       category:'Equipos inalámbricos', quantity:6, model:'EW-D'},
      {id:10,name:'Wisycom MCR42S',        category:'Antenas de RF',        quantity:4, model:'MCR42S'}
    ],
    dispatches:[
      {id:1,origin:1,
       stops:[
         {locationId:2,items:[{equipId:1,qty:6},{equipId:3,qty:2}]},
         {locationId:4,items:[{equipId:5,qty:4}]}
       ],
       generatedBy:'Carlos Medina',driver:'Mario González',
       dateStart:'2025-05-10T08:00',dateEnd:'2025-05-12T22:00',notes:'Show Divididos - Multi parada'}
    ]
  },
  nextId:{location:10,equipment:20,dispatch:10,user:10},
  listeners:[],
  on(fn){this.listeners.push(fn)},
  emit(){this.listeners.forEach(fn=>fn())},
  navigate(v){this.view=v;this.emit()},
  login(u,p){
    const x=this.data.users.find(u2=>u2.username===u&&u2.password===p);
    if(x){
      this.user=x;
      // Request geolocation — resolves asynchronously
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          pos=>{
            this.userLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};
            this.emit(); // re-render so the map can place the marker
          },
          ()=>{ this.userLocation=null; } // denied or unavailable — no problem
        );
      }
      this.navigate(x.role==='driver'?'mytrips':'map');
      return true;
    }
    return false;
  },
  logout(){this.user=null;this.navigate('login')},
  // role helpers
  isAdmin(){return this.user?.role==='admin'},
  canEdit(){return this.user?.role==='admin'||this.user?.role==='deposito'},
  isDriver(){return this.user?.role==='driver'},
  roleLabel(r){return{admin:'Administrador',deposito:'Depósito',viewer:'Viewer',driver:'Transportista'}[r]||r},
  roleColor(r){return{admin:'#7c6af7',deposito:'#f0a020',viewer:'#22c87a',driver:'#3bc0f7'}[r]||'#888'},
};

// ─── UTILS ──────────────────────────────────────────────────────────────────
function el(tag,attrs={},children=[]){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{if(c!=null)e.append(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
const fmt=d=>{
  if(!d) return '-';
  // datetime-local values have 'T', plain dates don't
  if(d.includes('T')){
    const dt=new Date(d);
    return dt.toLocaleDateString('es-AR')+' '+dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }
  return new Date(d+'T00:00').toLocaleDateString('es-AR');
};
const catColor=c=>({'Parlantes':'#7c6af7','Amplificadores':'#22c87a','Micrófonos':'#f0a020','Pies de micrófono':'#1db88a','Equipos inalámbricos':'#f04a4a','Antenas de RF':'#3bc0f7'})[c]||'#888';
const badge=(t,c)=>el('span',{class:'badge',style:{background:c+'22',color:c,border:`1px solid ${c}44`}},[t]);
const today=()=>new Date().toISOString().slice(0,16); // "YYYY-MM-DDTHH:MM" — matches datetime-local format
const isMobile=()=>window.innerWidth<=640;

const allItems=d=>(d.stops||[]).flatMap(s=>s.items||[]);
const routeLabel=d=>{
  const orig=App.data.locations.find(l=>l.id===d.origin);
  const stops=(d.stops||[]).map(s=>App.data.locations.find(l=>l.id===s.locationId)?.name||'?');
  return [orig?.name||'?',...stops].join(' → ');
};

function ffInput(label,id,type,value,extra={}){
  const w=el('div',{class:'form-field'});
  w.append(el('label',{for:id},[label]));
  const attrs=Object.assign({id,type,style:{width:'100%',padding:'.6rem .8rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}},extra);
  if(value!==undefined&&value!==null) attrs.value=String(value);
  w.append(el('input',attrs)); return w;
}
function ffSelect(label,id,options,selected){
  const w=el('div',{class:'form-field'});
  w.append(el('label',{for:id},[label]));
  const s=el('select',{id,style:{width:'100%',padding:'.6rem .8rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
  options.forEach(o=>{const op=el('option',{value:o.v},[o.l]);if(String(o.v)===String(selected))op.selected=true;s.append(op)});
  w.append(s); return w;
}

// ════════════════════════════════════════════════════════════════════════════
// WEB COMPONENTS
// ════════════════════════════════════════════════════════════════════════════

class AppRoot extends HTMLElement {
  connectedCallback(){this.render();App.on(()=>this.render())}
  render(){
    this.innerHTML='';
    if(App.view==='login') this.append(document.createElement('login-screen'));
    else if(App.view==='register') this.append(document.createElement('register-screen'));
    else if(App.view==='admin-register') this.append(document.createElement('admin-register-screen'));
    else this.append(document.createElement('app-shell'));
  }
}
customElements.define('app-root',AppRoot);

// ─── LOGIN ───────────────────────────────────────────────────────────────────
class LoginScreen extends HTMLElement {
  connectedCallback(){
    this.style.cssText='display:flex;align-items:center;justify-content:center;min-height:100svh;padding:1.25rem;background:var(--bg)';
    const card=el('div',{style:{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'var(--radius-lg)',padding:'2rem',width:'100%',maxWidth:'360px',boxShadow:'var(--shadow)'}});
    const logo=el('div',{style:{textAlign:'center',marginBottom:'1.75rem'}});
    logo.innerHTML=`<div style="font-size:2.2rem;margin-bottom:.45rem">🔊</div><h1 style="font-size:1.45rem;font-weight:700">SoundTrack</h1><p style="color:var(--text2);font-size:.83rem;margin-top:.3rem">Gestión de Equipos de Audio</p>`;
    const err=el('p',{style:{color:'var(--red)',fontSize:'.83rem',marginBottom:'.75rem',display:'none'}},['Correo o contraseña incorrectos']);
    const userIn=el('input',{type:'email',placeholder:'Correo electrónico',style:{width:'100%',padding:'.75rem 1rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',marginBottom:'.65rem',display:'block',fontSize:'1rem'}});
    const passWrap=el('div',{style:{position:'relative',marginBottom:'1.1rem'}});
    const passIn=el('input',{type:'password',placeholder:'Contraseña',style:{width:'100%',padding:'.75rem 3rem .75rem 1rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',display:'block',fontSize:'1rem'}});
    const eyeBtn=el('button',{style:{position:'absolute',right:0,top:0,height:'100%',width:'2.75rem',background:'transparent',border:'none',color:'var(--text3)',display:'flex',alignItems:'center',justifyContent:'center',borderRadius:`0 var(--radius) var(--radius) 0`}});
    const eyeOpen=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const eyeClose=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>`;
    eyeBtn.innerHTML=eyeOpen; let vis=false;
    eyeBtn.onclick=()=>{vis=!vis;passIn.type=vis?'text':'password';eyeBtn.innerHTML=vis?eyeClose:eyeOpen;eyeBtn.style.color=vis?'var(--accent)':'var(--text3)'};
    passWrap.append(passIn,eyeBtn);
    const loginBtn=el('button',{style:{width:'100%',padding:'.85rem',background:'var(--accent)',color:'#fff',border:'none',borderRadius:'var(--radius)',fontWeight:'600',fontSize:'1rem'}},['Ingresar']);
    const go=()=>{if(!App.login(userIn.value.trim(),passIn.value)){err.style.display='block';userIn.focus()}};
    loginBtn.onclick=go; passIn.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    const hint=el('p',{style:{marginTop:'1.1rem',color:'var(--text3)',fontSize:'.73rem',textAlign:'center'}},['admin/admin123 · deposito/dep123 · viewer/viewer123 · mario/mario123']);
    const regLink=el('div',{style:{marginTop:'.85rem',textAlign:'center',fontSize:'.82rem',color:'var(--text2)'}});
    const regBtn=el('button',{style:{background:'transparent',border:'none',color:'var(--accent)',fontWeight:'500',fontSize:'.82rem',cursor:'pointer',textDecoration:'underline',padding:'0'}},['Crear cuenta nueva']);

}

class RegisterScreen extends HTMLElement {
  connectedCallback(){
    this.style.cssText='display:flex;align-items:center;justify-content:center;min-height:100svh;padding:1rem;background:var(--bg)';
    const card=el('div',{style:{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'var(--radius-lg)',padding:'2rem',width:'100%',maxWidth:'380px',boxShadow:'var(--shadow)',maxHeight:'95svh',overflowY:'auto',margin:'auto'}});

    // Logo
    const logo=el('div',{style:{textAlign:'center',marginBottom:'1.5rem'}});
    logo.innerHTML=`<div style="font-size:2rem;margin-bottom:.4rem">🔊</div><h1 style="font-size:1.35rem;font-weight:700">Crear cuenta</h1><p style="color:var(--text2);font-size:.82rem;margin-top:.25rem">SoundTrack · Audio</p>`;
    card.append(logo);

    // Store field wrappers to mark them red
    const fieldWrappers={};

    // Name
    const fnWrap=el('div',{style:{marginBottom:'.65rem'}});
    fnWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Nombre']));
    const fnIn=el('input',{id:'rg-fname',type:'text',placeholder:'Nombre',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
    fnWrap.append(fnIn);
    card.append(fnWrap);
    fieldWrappers.firstName=fnWrap;

    // Lastname
    const lnWrap=el('div',{style:{marginBottom:'.65rem'}});
    lnWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Apellido']));
    const lnIn=el('input',{id:'rg-lname',type:'text',placeholder:'Apellido',style:{width:'100%',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});
    lnWrap.append(lnIn);
    card.append(lnWrap);
    fieldWrappers.lastName=lnWrap;

    // Phone with country code
    const phoneWrap=el('div',{style:{marginBottom:'.65rem'}});
    phoneWrap.append(el('label',{style:{display:'block',fontSize:'.8rem',color:'var(--text2)',marginBottom:'.25rem'}},['Teléfono']));
    const phoneRow=el('div',{style:{display:'flex',gap:'.3rem',width:'100%'}});

    COUNTRY_CODES.forEach(c=>{
      const opt=el('option',{value:c.code},[`${c.flag} ${c.code}`]);
      if(c.code==='+54') opt.selected=true;
      codeSel.append(opt);
    });
    const phoneIn=el('input',{id:'rg-phone',type:'tel',placeholder:'Número',style:{flex:'1',minWidth:'0',padding:'.6rem .75rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem'}});

      lower:/[a-z]/.test(pass),

      special:/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)

    submitBtn.onclick=()=>{
      clearFields();
      const firstName=fnIn.value.trim();
      const lastName=lnIn.value.trim();
      const countryCode=codeSel.value;
      const phone=phoneIn.value.trim();
      const email=emailIn.value.trim();
      const email2=email2In.value.trim();
      const pass=passIn.value;
      const pass2=pass2In.value;
      const role=roleSel.value;

      if(!firstName||!lastName){showError('Nombre y apellido son obligatorios.','firstName');return}
      if(!phone){showError('Ingresá tu número de teléfono.','phone');return}
      if(!/^\d{4,15}$/.test(phone.replace(/\s|-/g,''))){showError('Número de teléfono inválido (solo dígitos, 4-15).','phone');return}
      if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showError('Correo electrónico inválido.','email');return}
      if(email!==email2){showError('Los correos electrónicos no coinciden.','email2');return}
      if(App.data.users.find(u=>u.username===email)){showError('Ese correo ya está registrado.','email');return}
      
      // Validate password
      const passVal=validatePass(pass);
      if(!pass){showError('Ingresá una contraseña.','password');return}
      if(pass!==pass2){showError('Las contraseñas no coinciden.','password2');return}
      if(!passVal.length){showError('La contraseña debe tener al menos 8 caracteres.','password');return}
      if(!passVal.lower){showError('La contraseña debe incluir una letra minúscula.','password');return}
      if(!passVal.upper){showError('La contraseña debe incluir una letra mayúscula.','password');return}
      if(!passVal.digit){showError('La contraseña debe incluir un número.','password');return}
      if(!passVal.special){showError('La contraseña debe incluir un carácter especial (!@#$%^&*...).','password');return}

      // Create user
      const name=`${firstName} ${lastName}`;
      App.data.users.push({
        id:++App.nextId.user,
        name,
        firstName,
        lastName,
        username:email,
        email,
        phone:`${countryCode} ${phone}`,
        password:pass,
        role
      });

      App.navigate('users');
    };

    card.append(submitBtn);

    // Back link to users
    const backRow=el('div',{style:{textAlign:'center',fontSize:'.82rem',color:'var(--text2)'}});
    const backBtn=el('button',{style:{background:'transparent',border:'none',color:'var(--accent)',fontWeight:'500',fontSize:'.82rem',cursor:'pointer',textDecoration:'underline',padding:'0'}},['Volver a usuarios']);
    backBtn.onclick=()=>App.navigate('users');
    backRow.append(backBtn);
    card.append(backRow);

    this.append(card);
  }
}

    const uname=el('div',{class:'sidebar-user-name',style:{fontWeight:'500',fontSize:'.85rem',marginBottom:'.3rem'}},[App.user?.name||'']);

    const lbi=el('button',{style:{display:'none',background:'transparent',border:'none',color:'var(--text3)',fontSize:'1.2rem',cursor:'pointer',width:'100%',textAlign:'center',marginTop:'.15rem',lineHeight:'1'},class:'sidebar-logout-icon',title:'Cerrar sesión'},['↩']); lbi.onclick=()=>App.logout();
    ua.append(uname,rb,el('br'),lbf,lbi); sb.append(logoArea,nav,ua);

class MapView extends HTMLElement {
  connectedCallback(){this.render()}
  render(){
    this.innerHTML='';
    const header=el('div',{class:'view-header'});
    header.innerHTML=`<h2>🗺️ Mapa de Ubicaciones</h2>`;
    const legend=el('div',{style:{display:'flex',gap:'.65rem',fontSize:'.76rem',alignItems:'center',flexShrink:'0'}});
    legend.append(
      el('span',{style:{display:'flex',alignItems:'center',gap:'.3rem',color:'var(--text2)'}},[el('span',{style:{width:'9px',height:'9px',borderRadius:'50%',background:'#7c6af7',display:'inline-block'}},[]),'Dep.']),
      el('span',{style:{display:'flex',alignItems:'center',gap:'.3rem',color:'var(--text2)'}},[el('span',{style:{width:'9px',height:'9px',borderRadius:'50%',background:'#22c87a',display:'inline-block'}},[]),'Show'])
    );
    header.append(legend);

    const outer=el('div',{class:'map-outer'});
    const body=el('div',{class:'map-body'});
    const mapDiv=el('div',{id:'leaflet-map',class:'map-container'});

    // Mobile toggle
    let panelOpen=true;
    const toggle=el('div',{class:'map-panel-toggle'});
    toggle.innerHTML=`<span>📍 Puntos (${App.data.locations.length})</span><span id="ptarr">▼</span>`;
    const spacer=el('div',{class:'map-expanded-spacer'});
    toggle.onclick=()=>{
      panelOpen=!panelOpen;
      toggle.querySelector('#ptarr').textContent=panelOpen?'▼':'▶';
      if(window.innerWidth<=640){
        if(!panelOpen) panel.classList.add('hidden');
        else panel.classList.remove('hidden');
        setTimeout(()=>{ if(this._map) this._map.invalidateSize() },230);
      }
    };

    const panel=el('div',{class:'map-panel'});
    panel.innerHTML=`<h3 style="font-size:.78rem;font-weight:600;margin-bottom:.65rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Puntos registrados</h3>`;
    App.data.locations.forEach(loc=>{
      const card=el('div',{style:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'.65rem',marginBottom:'.45rem',cursor:'pointer'}});
      card.onmouseenter=()=>card.style.borderColor='rgba(255,255,255,.2)';
      card.onmouseleave=()=>card.style.borderColor='rgba(255,255,255,.08)';
      const top=el('div',{style:{display:'flex',alignItems:'center',gap:'.4rem',marginBottom:'.2rem'}});
      top.append(el('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:loc.color,display:'inline-block',flexShrink:'0'}},[]),el('span',{style:{fontWeight:'500',fontSize:'.85rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[loc.name]));
      const addr=el('p',{style:{color:'var(--text2)',fontSize:'.75rem',marginBottom:'.3rem'}},[loc.address]);
      const eq=el('div',{style:{fontSize:'.72rem',color:'var(--text3)'}},[this.getEquipText(loc.id)]);
      card.append(top,addr,eq);
      card.onclick=()=>{if(this._map&&this._markers?.[loc.id]){this._map.setView([loc.lat,loc.lng],15,{animate:true});this._markers[loc.id].openPopup()}};
      panel.append(card);
    });

    // "Mi ubicación" card — shown only when geolocation is available
    if(App.userLocation){
      const {lat,lng}=App.userLocation;
      const myCard=el('div',{style:{background:'rgba(59,192,247,.08)',border:'1px solid rgba(59,192,247,.25)',borderRadius:'var(--radius)',padding:'.65rem',marginTop:'.35rem',cursor:'pointer'}});
      myCard.onmouseenter=()=>myCard.style.borderColor='rgba(59,192,247,.5)';
      myCard.onmouseleave=()=>myCard.style.borderColor='rgba(59,192,247,.25)';
      const myTop=el('div',{style:{display:'flex',alignItems:'center',gap:'.4rem',marginBottom:'.15rem'}});
      myTop.append(el('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#3bc0f7',display:'inline-block',flexShrink:'0'}},[]),el('span',{style:{fontWeight:'600',fontSize:'.85rem',color:'#3bc0f7'}},['📍 Mi ubicación']));
      const myCoords=el('p',{style:{color:'var(--text2)',fontSize:'.73rem'}},[`${lat.toFixed(5)}, ${lng.toFixed(5)}`]);
      myCard.append(myTop,myCoords);
      myCard.onclick=()=>{if(this._map&&this._userMarker){this._map.setView([lat,lng],16,{animate:true});this._userMarker.openPopup()}};
      panel.append(myCard);
    }

    body.append(mapDiv,panel);
    outer.append(toggle,body,spacer);
    this.append(header,outer);
    requestAnimationFrame(()=>this.initMap());
  }
  getEquipText(id){
    const t=today(),a=App.data.dispatches.filter(d=>d.destination===id&&d.dateEnd>=t);
    return a.length?`${a.flatMap(d=>d.items).length} ítem(s) activos`:'Sin equipos activos';
  }
  initMap(){
    if(!window.L){setTimeout(()=>this.initMap(),100);return}
    const c=this.querySelector('#leaflet-map');
    if(!c||c.offsetWidth===0){setTimeout(()=>this.initMap(),100);return}
    const locs=App.data.locations;
    const map=L.map(c,{zoomControl:true}).setView([locs.reduce((s,l)=>s+l.lat,0)/locs.length,locs.reduce((s,l)=>s+l.lng,0)/locs.length],12);
    this._map=map; this._markers={};
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | © <a href="https://carto.com/">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(map);
    App.data.dispatches.forEach(d=>{
      const from=locs.find(l=>l.id===d.origin);
      if(!from) return;
      const active=d.dateEnd>=today();
      let prev=from;
      (d.stops||[]).forEach(s=>{
        const to=locs.find(l=>l.id===s.locationId);
        if(!to) return;
        L.polyline([[prev.lat,prev.lng],[to.lat,to.lng]],{color:active?'#7c6af7':'#444',weight:active?2.5:1.5,opacity:active?.7:.4,dashArray:'8,6'}).addTo(map);
        prev=to;
      });
    });
    locs.forEach(loc=>{
      const icon=L.divIcon({className:'',html:`<div style="width:32px;height:32px;border-radius:50%;background:${loc.color}33;border:2.5px solid ${loc.color};display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px ${loc.color}55"><div style="width:10px;height:10px;border-radius:50%;background:${loc.color}"></div></div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18]});
      const t=today();
      const activeStopItems=App.data.dispatches
        .filter(d=>d.dateStart<=t&&d.dateEnd>=t)
        .flatMap(d=>(d.stops||[]).filter(s=>s.locationId===loc.id).flatMap(s=>s.items||[]));
      const eqH=activeStopItems.length
        ? activeStopItems.map(it=>{const eq=App.data.equipment.find(e=>e.id===it.equipId);return`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span style="font-size:12px">${eq?.name||'?'}</span><span style="font-size:12px;color:${loc.color};font-weight:600;margin-left:8px">${it.qty}×</span></div>`}).join('')
        :`<p style="color:#6a6a7a;font-size:12px;margin-top:4px">Sin equipos activos</p>`;
      const popup=`<div style="min-width:175px"><div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span style="width:9px;height:9px;border-radius:50%;background:${loc.color};display:inline-block;flex-shrink:0"></span><strong style="font-size:13px">${loc.name}</strong></div><p style="color:#a0a0b0;font-size:12px;margin-bottom:7px">${loc.address}</p><div style="font-size:10px;color:#6a6a7a;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Equipos activos</div>${eqH}</div>`;
      const marker=L.marker([loc.lat,loc.lng],{icon}).addTo(map).bindPopup(popup,{className:'st-popup',maxWidth:250});
      marker.on('click',()=>this.showDetail(loc)); this._markers[loc.id]=marker;
    });
    if(locs.length>1) map.fitBounds(L.latLngBounds(locs.map(l=>[l.lat,l.lng])),{padding:[40,40]});

    // Place user's own location marker if already available
    this._addUserMarker(map);

    // Also update marker if geolocation arrives after map is drawn
    App.on(()=>this._addUserMarker(map));
  }

  _addUserMarker(map){
    if(!App.userLocation) return;
    const {lat,lng}=App.userLocation;

    // Remove previous user marker if any
    if(this._userMarker){ this._userMarker.remove(); this._userMarker=null; }

    const pulseHtml=`
      <div style="position:relative;width:36px;height:36px">
        <div style="position:absolute;inset:0;border-radius:50%;background:#3bc0f744;border:2.5px solid #3bc0f7;animation:userPulse 1.8s ease-out infinite"></div>
        <div style="position:absolute;inset:9px;border-radius:50%;background:#3bc0f7;box-shadow:0 0 8px #3bc0f7aa"></div>
      </div>`;
    const icon=L.divIcon({className:'',html:pulseHtml,iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-20]});
    const name=App.user?.name||'Mi ubicación';
    const popup=`<div style="min-width:140px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
        <span style="width:9px;height:9px;border-radius:50%;background:#3bc0f7;display:inline-block;flex-shrink:0"></span>
        <strong style="font-size:13px">${name}</strong>
      </div>
      <p style="color:#a0a0b0;font-size:12px">${lat.toFixed(5)}, ${lng.toFixed(5)}</p>
    </div>`;
    this._userMarker=L.marker([lat,lng],{icon,zIndexOffset:500})
      .addTo(map).bindPopup(popup,{className:'st-popup',maxWidth:220});

    // Add pulse keyframes once
    if(!document.getElementById('user-pulse-style')){
      const s=document.createElement('style');
      s.id='user-pulse-style';
      s.textContent=`@keyframes userPulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(2);opacity:0}100%{transform:scale(2);opacity:0}}`;
      document.head.append(s);
    }
  }
  showDetail(loc){const m=document.createElement('map-detail-modal');m.loc=loc;document.body.append(m)}
}

class MapDetailModal extends HTMLElement {
  connectedCallback(){
    this.className='modal-overlay';
    const loc=this.loc;
    const now=new Date().toISOString().slice(0,16);

    // Despachos activos AHORA donde esta loc es una de las paradas
    const activeNow=App.data.dispatches.filter(d=>
      d.dateStart<=now && d.dateEnd>=now &&
      (d.stops||[]).some(s=>s.locationId===loc.id)
    );
    // Despachos futuros donde esta loc es una de las paradas
    const upcoming=App.data.dispatches.filter(d=>
      d.dateStart>now &&
      (d.stops||[]).some(s=>s.locationId===loc.id)
    );

    // Equipo que llegó a ESTE lugar específicamente (items de la parada correspondiente)
    const arrivedMap=new Map();
    activeNow.forEach(d=>{
      (d.stops||[]).filter(s=>s.locationId===loc.id).forEach(s=>{
        s.items.forEach(it=>arrivedMap.set(it.equipId,(arrivedMap.get(it.equipId)||0)+it.qty));
      });
    });

    // ── Para el depósito: calcular lo que está AHÍ = total − lo que está en campo ahora ──
    const isDeposito=loc.type==='deposito';
    let depositoMap=new Map(); // equipId → qty en depósito ahora
    if(isDeposito){
      const outNow=new Map();
      App.data.dispatches.filter(d=>d.dateStart<=now&&d.dateEnd>=now)
        .forEach(d=>allItems(d).forEach(it=>outNow.set(it.equipId,(outNow.get(it.equipId)||0)+it.qty)));
      App.data.equipment.forEach(eq=>{
        const inField=outNow.get(eq.id)||0;
        const inDeposit=eq.quantity-inField;
        if(inDeposit>0) depositoMap.set(eq.id,inDeposit);
      });
    }

    const displayMap=isDeposito ? depositoMap : arrivedMap;

    const box=el('div',{class:'modal-box sm'});

    // ── Header ──
    const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.65rem'}});
    const ttl=el('div',{style:{display:'flex',alignItems:'center',gap:'.5rem'}});
    ttl.append(
      el('span',{style:{width:'11px',height:'11px',borderRadius:'50%',background:loc.color,display:'inline-block'}},[]),
      el('h3',{style:{fontSize:'.98rem',fontWeight:'600'}},[loc.name])
    );
    const cls=el('button',{style:{background:'transparent',border:'none',color:'var(--text2)',fontSize:'1.3rem',padding:'.1rem .3rem',lineHeight:'1',cursor:'pointer'}},['×']);
    cls.onclick=()=>this.remove();
    top.append(ttl,cls);
    box.append(top);
    box.append(el('p',{style:{color:'var(--text2)',fontSize:'.8rem',marginBottom:'.55rem'}},[loc.address]));

    const typeRow=el('div',{style:{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.85rem'}});
    typeRow.append(badge(loc.type==='deposito'?'Depósito':'Lugar de show',loc.color));
    const nowLabel=el('span',{style:{fontSize:'.72rem',color:'var(--text3)',marginLeft:'auto'}},
      ['Ahora: '+new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})]);
    typeRow.append(nowLabel);
    box.append(typeRow);

    // ── Sección principal de equipos ──
    const sectionLabel=isDeposito ? 'Equipo en depósito ahora' : 'Equipos presentes ahora';
    box.append(el('h4',{style:{fontSize:'.75rem',color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'.4rem'}},[sectionLabel]));

    if(displayMap.size===0){
      const emptyMsg=isDeposito
        ? 'Todo el equipo se encuentra fuera del depósito en este momento'
        : 'Sin equipos en este lugar ahora mismo';
      box.append(el('div',{style:{background:'var(--bg3)',borderRadius:'8px',padding:'.75rem',marginBottom:'.75rem',fontSize:'.83rem',color:'var(--text3)',textAlign:'center'}},[emptyMsg]));
    } else {
      const totalUnits=[...displayMap.values()].reduce((s,v)=>s+v,0);
      const totalTypes=displayMap.size;

      // Summary pill
      const summaryRow=el('div',{style:{background:loc.color+'18',border:`1px solid ${loc.color}44`,borderRadius:'8px',padding:'.55rem .75rem',marginBottom:'.5rem',display:'flex',alignItems:'center',justifyContent:'space-between'}});
      summaryRow.innerHTML=`<span style="font-size:.82rem;font-weight:500;color:var(--text)">${totalTypes} tipo(s) de equipo</span><span style="font-size:.82rem;font-weight:700;color:${loc.color}">${totalUnits} unidad(es)</span>`;
      box.append(summaryRow);

      // Collapsible full list
      const listWrap=el('div',{style:{display:'none',marginBottom:'.6rem'}});

      // Group by category
      const byCategory=new Map();
      displayMap.forEach((qty,equipId)=>{
        const eq=App.data.equipment.find(e=>e.id===equipId);
        if(!eq) return;
        if(!byCategory.has(eq.category)) byCategory.set(eq.category,[]);
        byCategory.get(eq.category).push({eq,qty});
      });

      byCategory.forEach((items,cat)=>{
        const c=catColor(cat);
        const catHeader=el('div',{style:{fontSize:'.7rem',fontWeight:'600',color:c,textTransform:'uppercase',letterSpacing:'.05em',padding:'.45rem 0 .2rem'}});
        catHeader.textContent=cat;
        listWrap.append(catHeader);
        items.forEach(({eq,qty})=>{
          const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.45rem .65rem',background:'var(--bg3)',borderRadius:'7px',marginBottom:'.28rem'}});
          row.innerHTML=`<span style="font-size:.83rem">${eq.name}</span><span style="font-weight:700;font-size:.88rem;color:${c}">${qty}×</span>`;
          listWrap.append(row);
        });
      });

      // For non-depot: show source dispatches
      if(!isDeposito && activeNow.length){
        const srcTitle=el('div',{style:{fontSize:'.7rem',color:'var(--text3)',marginTop:'.5rem',marginBottom:'.3rem'}},['Despachos activos en este lugar:']);
        listWrap.append(srcTitle);
        activeNow.forEach(d=>{
          const orig=App.data.locations.find(l=>l.id===d.origin);
          const row=el('div',{style:{fontSize:'.76rem',color:'var(--text2)',padding:'.3rem .5rem',background:'var(--bg3)',borderRadius:'6px',marginBottom:'.25rem'}});

          listWrap.append(row);
        });
      }

      // For depot: show what's currently out in field
      if(isDeposito){
        const outNow=new Map();
        App.data.dispatches.filter(d=>d.dateStart<=now&&d.dateEnd>=now)
          .forEach(d=>allItems(d).forEach(it=>outNow.set(it.equipId,(outNow.get(it.equipId)||0)+it.qty)));
        const totalOut=[...outNow.values()].reduce((s,v)=>s+v,0);
        if(totalOut>0){
          const outTitle=el('div',{style:{fontSize:'.7rem',color:'var(--text3)',marginTop:'.6rem',marginBottom:'.3rem'}},[`Equipo fuera del depósito ahora (${totalOut} unidad(es)):`]);
          listWrap.append(outTitle);
          outNow.forEach((qty,equipId)=>{
            const eq=App.data.equipment.find(e=>e.id===equipId);
            if(!eq) return;
            const c=catColor(eq.category);
            const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.4rem .65rem',background:'var(--bg3)',borderRadius:'7px',marginBottom:'.25rem',opacity:'.7'}});
            row.innerHTML=`<span style="font-size:.82rem;color:var(--text2)">${eq.name}</span><span style="font-weight:600;font-size:.85rem;color:var(--amber)">${qty}× fuera</span>`;
            listWrap.append(row);
          });
        }
      }

      // Toggle button — starts expanded for depósito
      let expanded=isDeposito;
      listWrap.style.display=expanded?'block':'none';
      const toggleBtn=el('button',{class:'btn',style:{width:'100%',textAlign:'center',fontSize:'.8rem',marginBottom:'.65rem'}},
        [expanded?'Ocultar listado ▲':'Ver listado completo de equipos ▼']);
      toggleBtn.onclick=()=>{
        expanded=!expanded;
        listWrap.style.display=expanded?'block':'none';
        toggleBtn.textContent=expanded?'Ocultar listado ▲':'Ver listado completo de equipos ▼';
      };
      box.append(toggleBtn,listWrap);
    }

    if(upcoming.length){
      box.append(el('h4',{style:{fontSize:'.75rem',color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'.4rem',marginTop:'.2rem'}},['Próximos despachos a este lugar']));
      upcoming.slice(0,3).forEach(d=>{
        const orig=App.data.locations.find(l=>l.id===d.origin);
        const stopItems=(d.stops||[]).filter(s=>s.locationId===loc.id).flatMap(s=>s.items||[]);
        const totalU=stopItems.reduce((s,it)=>s+it.qty,0);
        const row=el('div',{style:{background:'var(--bg3)',borderRadius:'8px',padding:'.55rem .65rem',marginBottom:'.3rem',border:'1px solid var(--border)'}});
        row.innerHTML=`<div style="font-size:.82rem;font-weight:500;margin-bottom:.2rem">Desde ${orig?.name||'?'} · ${totalU} unidad(es)</div><div style="font-size:.75rem;color:var(--text2)">Llega: ${fmt(d.dateStart)} · Conductor: ${d.driver}</div>`;
        box.append(row);
      });
      if(upcoming.length>3) box.append(el('div',{style:{fontSize:'.73rem',color:'var(--text3)',textAlign:'center',padding:'.25rem 0'}},[`+${upcoming.length-3} despacho(s) más`]));
    }

    this.onclick=e=>{if(e.target===this)this.remove()};
    this.append(box);
  }
}

    // Spinner indicator
    const searchStatus=el('div',{style:{fontSize:'.73rem',color:'var(--text3)',marginTop:'.25rem',minHeight:'1rem'}});

    // Suggestions dropdown
    const dropdown=el('div',{style:{
      position:'absolute',top:'calc(100% - .85rem)',left:'0',right:'0',
      background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'0 0 var(--radius) var(--radius)',
      boxShadow:'0 8px 24px rgba(0,0,0,.5)',maxHeight:'200px',overflowY:'auto',
      display:'none',zIndex:'50'
    }});

    addrWrap.append(addrInput, dropdown, searchStatus);
    box.append(addrWrap);

    // Type select
    box.append(ffSelect('Tipo','lf-type',[{v:'deposito',l:'Depósito'},{v:'show',l:'Lugar de show'}],loc?.type||'show'));

    // Mini-map preview
    const mapLabel=el('div',{style:{fontSize:'.8rem',color:'var(--text2)',marginBottom:'.35rem'}},['Vista previa en el mapa']);
    const mapPlaceholder=el('div',{style:{
      height:'180px',borderRadius:'var(--radius)',overflow:'hidden',
      border:'1px solid var(--border)',background:'var(--bg3)',
      display:'flex',alignItems:'center',justifyContent:'center',
      color:'var(--text3)',fontSize:'.82rem',flexDirection:'column',gap:'.4rem'
    }});
    mapPlaceholder.innerHTML=`<span style="font-size:1.5rem">📍</span><span>${isEdit&&loc.lat?'Cargando mapa...':'Buscá una dirección para ver la ubicación'}</span>`;
    const miniMapWrap=el('div',{id:'lf-minimap',style:{height:'180px',borderRadius:'var(--radius)',overflow:'hidden',border:'1px solid var(--border)',display:'none'}});
    const mapContainer=el('div',{style:{marginBottom:'.85rem'}});
    mapContainer.append(mapLabel,mapPlaceholder,miniMapWrap);
    box.append(mapContainer);

    // Footer
    const footer=el('div',{class:'modal-footer'});
    const cancel=el('button',{class:'btn'},['Cancelar']);cancel.onclick=()=>this.remove();
    const saveBtn=el('button',{class:'btn btn-primary'},['Guardar']);
    saveBtn.onclick=()=>{
      const name=box.querySelector('#lf-name').value.trim();
      const addr=addrInput.value.trim();
      const type=box.querySelector('#lf-type').value;
      const color=type==='deposito'?'#7c6af7':'#22c87a';
      if(!name){addrInput.focus();return}
      if(!this._lat||!this._lng){searchStatus.style.color='var(--red)';searchStatus.textContent='Seleccioná una dirección de las sugerencias primero.';return}
      if(isEdit){loc.name=name;loc.address=addr;loc.lat=this._lat;loc.lng=this._lng;loc.type=type;loc.color=color}
      else App.data.locations.push({id:++App.nextId.location,name,address:addr,lat:this._lat,lng:this._lng,type,color});
      if(this.onSave)this.onSave();this.remove();
    };
    footer.append(cancel,saveBtn);box.append(footer);

    this.onclick=e=>{if(e.target===this)this.remove()};
    this.append(box);

    // If editing an existing location, show its map immediately
    if(isEdit && loc.lat && loc.lng){
      requestAnimationFrame(()=>this.showMiniMap(loc.lat,loc.lng,loc.address,mapPlaceholder,miniMapWrap));
    }

    // Autocomplete logic
    addrInput.addEventListener('input',()=>{
      clearTimeout(this._searchTimer);
      const q=addrInput.value.trim();
      dropdown.style.display='none';dropdown.innerHTML='';
      if(q.length<4){searchStatus.textContent='';return}
      searchStatus.style.color='var(--text3)';
      searchStatus.textContent='Buscando...';
      this._searchTimer=setTimeout(()=>this.searchAddress(q,dropdown,addrInput,searchStatus,mapPlaceholder,miniMapWrap),400);
    });

    // Hide dropdown on outside click
    document.addEventListener('click',(e)=>{if(!addrWrap.contains(e.target))dropdown.style.display='none'},{once:false,capture:false});
    addrInput.addEventListener('focus',()=>{if(dropdown.children.length)dropdown.style.display='block'});
  }

  async searchAddress(q, dropdown, input, status, placeholder, miniWrap){
    try{
      // Bias to Argentina / Buenos Aires area
      const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`;
      const res=await fetch(url,{headers:{'Accept-Language':'es','User-Agent':'SoundTrackApp/1.0'}});
      const data=await res.json();
      dropdown.innerHTML=''; 
      if(!data.length){status.textContent='Sin resultados. Intentá con más detalle.';dropdown.style.display='none';return}
      status.textContent='';
      data.forEach((item,i)=>{
        const row=el('div',{style:{
          padding:'.6rem .85rem',cursor:'pointer',fontSize:'.83rem',
          borderBottom:i<data.length-1?'1px solid var(--border)':'none',
          color:'var(--text)',lineHeight:'1.35'
        }});
        const mainText=item.name||item.display_name.split(',')[0];
        const subText=item.display_name.split(',').slice(1,4).join(',').trim();
        row.innerHTML=`<div style="font-weight:500">${mainText}</div><div style="font-size:.75rem;color:var(--text2);margin-top:1px">${subText}</div>`;
        row.onmouseenter=()=>row.style.background='var(--bg3)';
        row.onmouseleave=()=>row.style.background='transparent';
        row.onmousedown=e=>{
          e.preventDefault();
          const lat=parseFloat(item.lat), lng=parseFloat(item.lon);
          input.value=item.display_name.split(',').slice(0,3).join(',').trim();
          this._lat=lat; this._lng=lng;
          dropdown.style.display='none'; dropdown.innerHTML='';
          status.style.color='var(--green)'; status.textContent='✓ Ubicación confirmada';
          this.showMiniMap(lat,lng,input.value,placeholder,miniWrap);
        };
        dropdown.append(row);
      });
      dropdown.style.display='block';
    }catch(e){status.textContent='Error de conexión. Intentá de nuevo.';dropdown.style.display='none'}
  }

  showMiniMap(lat,lng,label,placeholder,miniWrap){
    placeholder.style.display='none';
    miniWrap.style.display='block';
    if(this._miniMap){
      this._miniMap.setView([lat,lng],16);
      if(this._miniMarker) this._miniMarker.setLatLng([lat,lng]);
      else this._miniMarker=L.marker([lat,lng]).addTo(this._miniMap);
      return;
    }
    // Init mini Leaflet map
    const map=L.map(miniWrap,{zoomControl:true,attributionControl:false,scrollWheelZoom:false}).setView([lat,lng],16);
    this._miniMap=map;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
    const icon=L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:#7c6af755;border:2.5px solid #7c6af7;display:flex;align-items:center;justify-content:center"><div style="width:8px;height:8px;border-radius:50%;background:#7c6af7"></div></div>`,iconSize:[24,24],iconAnchor:[12,12]});
    this._miniMarker=L.marker([lat,lng],{icon}).addTo(map);
    // Allow dragging to fine-tune
    this._miniMarker.setIcon(L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50%;background:#7c6af755;border:2.5px solid #7c6af7;display:flex;align-items:center;justify-content:center;cursor:move"><div style="width:9px;height:9px;border-radius:50%;background:#7c6af7"></div></div>`,iconSize:[28,28],iconAnchor:[14,14]}));
    this._miniMarker.options.draggable=true;
    this._miniMarker.dragging&&this._miniMarker.dragging.enable();
    this._miniMarker.on('dragend',()=>{const p=this._miniMarker.getLatLng();this._lat=p.lat;this._lng=p.lng;});
    // Map click to reposition
    map.on('click',e=>{this._lat=e.latlng.lat;this._lng=e.latlng.lng;this._miniMarker.setLatLng(e.latlng)});
    setTimeout(()=>map.invalidateSize(),50);
  }
}

class DispatchFormModal extends HTMLElement {
  connectedCallback(){

    genW.append(el('input',{type:'text',value:d?.generatedBy||App.user?.name||'',readonly:'',style:{width:'100%',padding:'.6rem .8rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text2)',fontSize:'.9rem'}}));
    box.append(genW);

    // Stops section
    box.append(el('div',{style:{fontSize:'.8rem',color:'var(--text2)',marginBottom:'.5rem',fontWeight:'500',marginTop:'.25rem'}},['Paradas del viaje']));

    // Alert panel
    this.alertPanel=el('div',{style:{display:'none',background:'rgba(240,74,74,.1)',border:'1px solid rgba(240,74,74,.4)',borderRadius:'var(--radius)',padding:'.75rem .9rem',marginBottom:'.75rem',fontSize:'.82rem',lineHeight:'1.5'}});
    box.append(this.alertPanel);

    // Stops container
    this.stopsEl=el('div');
    box.append(this.stopsEl);

    const addStopBtn=el('button',{style:{background:'transparent',border:'1px dashed var(--accent)',borderRadius:'8px',color:'var(--accent)',padding:'.45rem',fontSize:'.81rem',width:'100%',marginBottom:'.75rem',cursor:'pointer'}},['+ Agregar parada']);
    addStopBtn.onclick=()=>this.addStop();
    box.append(addStopBtn);

    // Notes
    const notesW=el('div',{class:'form-field'});
    notesW.append(el('label',{},['Notas']));
    const notesTA=el('textarea',{id:'df-notes',rows:'2',style:{width:'100%',padding:'.6rem .8rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.9rem',resize:'vertical'}});
    if(d?.notes) notesTA.value=d.notes;
    notesW.append(notesTA);
    box.append(notesW);

    // Date change listeners
    box.querySelector('#df-start').addEventListener('change',()=>this.validate());
    box.querySelector('#df-end').addEventListener('change',()=>this.validate());

    // Footer
    const footer=el('div',{class:'modal-footer'});
    const cancel=el('button',{class:'btn'},['Cancelar']);cancel.onclick=()=>this.remove();
    const save=el('button',{class:'btn btn-primary'},[isEdit?'Guardar cambios':'Guardar despacho']);
    save.onclick=()=>this.save(box,d,isEdit);
    footer.append(cancel,save);box.append(footer);

    this.onclick=e=>{if(e.target===this)this.remove()};
    this.append(box);
    this._box=box;
    this._editId=isEdit?d.id:null;

    // Pre-populate stops or add first empty stop
    if(isEdit&&d.stops?.length) d.stops.forEach(s=>this.addStop(s.locationId,s.items));
    else this.addStop();
  }

  addStop(preLocId=null, preItems=null){
    const stopIdx=this.stopsEl.children.length+1;
    const wrap=el('div',{style:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'.75rem',marginBottom:'.6rem'}});

    // Stop header
    const stopHeader=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.6rem'}});
    const stopLabel=el('div',{style:{fontSize:'.78rem',fontWeight:'600',color:'var(--accent)'}},['Parada '+stopIdx]);
    const remStop=el('button',{style:{background:'transparent',border:'none',color:'var(--red)',fontSize:'.85rem',cursor:'pointer',padding:'.1rem .3rem'}},['× Eliminar parada']);
    remStop.onclick=()=>{wrap.remove();this.renumberStops();this.validate()};
    stopHeader.append(stopLabel,remStop);
    wrap.append(stopHeader);

    // Destination select for this stop
    const destW=el('div',{style:{marginBottom:'.5rem'}});
    destW.append(el('label',{style:{display:'block',fontSize:'.78rem',color:'var(--text2)',marginBottom:'.25rem'}},['Destino']));
    const destSel=el('select',{class:'stop-dest',style:{width:'100%',padding:'.5rem .65rem',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',fontSize:'.85rem'}});
    App.data.locations.forEach(l=>{const o=el('option',{value:l.id},[l.name]);if(preLocId&&l.id===preLocId)o.selected=true;destSel.append(o)});
    destSel.addEventListener('change',()=>this.validate());
    destW.append(destSel);
    wrap.append(destW);

    // Equipment rows for this stop
    wrap.append(el('div',{style:{fontSize:'.76rem',color:'var(--text2)',marginBottom:'.3rem'}},['Equipos para esta parada']));
    const itemsEl=el('div',{class:'stop-items'});
    wrap.append(itemsEl);
    const addEqBtn=el('button',{style:{background:'transparent',border:'1px dashed var(--border)',borderRadius:'6px',color:'var(--text3)',padding:'.3rem .6rem',fontSize:'.78rem',cursor:'pointer',marginTop:'.1rem'}},['+ Equipo']);
    addEqBtn.onclick=()=>this.addEquipRow(itemsEl);
    wrap.append(addEqBtn);

    this.stopsEl.append(wrap);

    // Pre-populate equipment rows or add one empty
    if(preItems?.length) preItems.forEach(it=>this.addEquipRow(itemsEl,it.equipId,it.qty));
    else this.addEquipRow(itemsEl);
  }

  addEquipRow(itemsEl, preEquipId=null, preQty=1){
    const row=el('div',{class:'eq-row',style:{display:'flex',gap:'.3rem',alignItems:'center',marginBottom:'.3rem'}});
    const sel=el('select',{class:'eq-sel',style:{flex:'1',minWidth:0,padding:'.4rem .5rem',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--text)',fontSize:'.8rem'}});
    App.data.equipment.forEach(e=>{const o=el('option',{value:e.id},[`${e.name} (${e.category})`]);if(preEquipId&&e.id===preEquipId)o.selected=true;sel.append(o)});
    const qty=el('input',{class:'eq-qty',type:'number',min:'1',value:String(preQty),style:{width:'54px',padding:'.4rem .35rem',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--text)',textAlign:'center',flexShrink:'0'}});
    const rem=el('button',{style:{background:'transparent',border:'none',color:'var(--red)',fontSize:'1rem',padding:'.1rem .25rem',flexShrink:'0',lineHeight:'1',cursor:'pointer'}},['×']);
    rem.onclick=()=>{row.remove();this.validate()};
    sel.addEventListener('change',()=>this.validate());
    qty.addEventListener('input',()=>this.validate());
    row.append(sel,qty,rem);
    itemsEl.append(row);
  }

  renumberStops(){
    [...this.stopsEl.children].forEach((wrap,i)=>{
      const lbl=wrap.querySelector('.stop-label');
      if(lbl) lbl.textContent='Parada '+(i+1);
      // update inline label too
      const firstEl=wrap.querySelector('[style*="color:var(--accent)"]');
      if(firstEl) firstEl.textContent='Parada '+(i+1);
    });
  }

  getStops(){
    return [...this.stopsEl.children].map(wrap=>{
      const locationId=parseInt(wrap.querySelector('.stop-dest').value);
      const rawItems=[...wrap.querySelectorAll('.eq-row')].map(row=>({
        equipId:parseInt(row.querySelector('.eq-sel').value),
        qty:parseInt(row.querySelector('.eq-qty').value)||0
      })).filter(it=>it.equipId&&it.qty>0);
      // Aggregate duplicates within stop
      const map=new Map();
      rawItems.forEach(it=>map.set(it.equipId,(map.get(it.equipId)||0)+it.qty));
      const items=[...map.entries()].map(([equipId,qty])=>({equipId,qty}));
      return {locationId,items};
    }).filter(s=>s.items.length>0);
  }

  getAllItems(){
    // Aggregate all items across all stops for availability checking
    const map=new Map();
    this.getStops().forEach(s=>s.items.forEach(it=>map.set(it.equipId,(map.get(it.equipId)||0)+it.qty)));
    return [...map.entries()].map(([equipId,qty])=>({equipId,qty}));
  }

  validate(){
    if(!this._box) return;
    const dateStart=this._box.querySelector('#df-start').value;
    const dateEnd=this._box.querySelector('#df-end').value;
    if(!dateStart||!dateEnd||dateStart>=dateEnd){this.clearAlert();return}
    const items=this.getAllItems();
    if(!items.length){this.clearAlert();return}
    const conflicts=this.checkConflicts(dateStart,dateEnd,items,this._editId);
    if(conflicts.length) this.showConflicts(conflicts);
    else this.clearAlert();
  }

  checkConflicts(dateStart,dateEnd,items,excludeId=null){
    const issues=[];
    items.forEach(it=>{
      const eq=App.data.equipment.find(e=>e.id===it.equipId);
      if(!eq) return;
      if(it.qty>eq.quantity){issues.push({eq,requested:it.qty,available:eq.quantity,overlapping:[],overStock:true});return}
      const overlapping=App.data.dispatches.filter(d=>d.id!==excludeId&&d.dateStart<dateEnd&&d.dateEnd>dateStart);
      const busyQty=overlapping.flatMap(allItems).filter(x=>x.equipId===it.equipId).reduce((s,x)=>s+x.qty,0);
      const available=eq.quantity-busyQty;
      if(it.qty>available) issues.push({eq,requested:it.qty,available:Math.max(0,available),overlapping});
    });
    return issues;
  }

  save(box,d,isEdit){
    const origin=parseInt(box.querySelector('#df-orig').value);
    const dateStart=box.querySelector('#df-start').value;
    const dateEnd=box.querySelector('#df-end').value;
    const driver=box.querySelector('#df-driver').value.trim();
    const notes=box.querySelector('#df-notes').value.trim();
    const stops=this.getStops();
    if(!dateStart||!dateEnd||!driver){this.showAlert('⚠️ Completá fecha, hora y conductor.');return}
    if(dateStart>=dateEnd){this.showAlert('⚠️ La fecha de fin debe ser posterior a la de inicio.');return}
    if(!stops.length){this.showAlert('⚠️ Agregá al menos una parada con equipo.');return}
    const items=this.getAllItems();
    const conflicts=this.checkConflicts(dateStart,dateEnd,items,this._editId);
    if(conflicts.length){this.showConflicts(conflicts);return}
    if(isEdit){d.origin=origin;d.stops=stops;d.dateStart=dateStart;d.dateEnd=dateEnd;d.driver=driver;d.notes=notes}
    else App.data.dispatches.push({id:++App.nextId.dispatch,origin,stops,dateStart,dateEnd,driver,generatedBy:App.user?.name||'',notes});
    if(this.onSave)this.onSave();this.remove();
  }

  showConflicts(conflicts){
    const lines=conflicts.map(c=>{
      if(c.overStock) return `<div style="margin-bottom:.4rem"><span style="font-weight:600;color:var(--red)">⛔ ${c.eq.name}</span>: solicitás <strong>${c.requested}</strong> pero el inventario total tiene <strong style="color:var(--red)">${c.available}</strong>.</div>`;
      const info=c.overlapping.length?c.overlapping.map(d=>`${fmt(d.dateStart)}→${fmt(d.dateEnd)} (${routeLabel(d)})`).join('; '):'—';
      return `<div style="margin-bottom:.4rem"><span style="font-weight:600;color:var(--red)">⚠️ ${c.eq.name}</span>: solicitás <strong>${c.requested}</strong>, disponible: <strong style="color:${c.available>0?'var(--amber)':'var(--red)'}">${c.available}</strong>.<div style="font-size:.74rem;color:var(--text3);margin-top:.15rem">En uso: ${info}</div></div>`;
    }).join('');
    this.alertPanel.innerHTML=`<div style="font-weight:600;margin-bottom:.45rem;color:var(--red)">Conflicto de disponibilidad</div>${lines}`;
    this.alertPanel.style.display='block';
  }
  showAlert(msg){this.alertPanel.innerHTML=msg;this.alertPanel.style.display='block'}
  clearAlert(){this.alertPanel.style.display='none';this.alertPanel.innerHTML=''}
}
